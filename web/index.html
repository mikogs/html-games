<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
<style>
  :root { --bg: #000; --panel: #05052a; --wall: #2b5cff; --yellow: #ffd800; --text: #f2f2f2; --dim: #7a7aa8; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 16px; background: var(--bg); color: var(--text);
    font-family: "Tiny5", "Courier New", monospace; font-size: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
  }
  body::after {
    content: ""; pointer-events: none; position: fixed; inset: 0; z-index: 10;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.22) 2px 3px);
  }
  h1 { margin: 0; font-size: 48px; letter-spacing: 4px; color: var(--yellow); text-shadow: 3px 3px 0 #c43c00, 6px 6px 0 #4a1100; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 420px; }
  a {
    display: block; padding: 16px 18px; text-decoration: none; color: var(--text);
    background: var(--panel); border: 4px solid var(--wall); box-shadow: 0 0 0 4px #000, 0 0 0 8px #0b0b5a;
  }
  a:hover, a:focus-visible { border-color: var(--yellow); outline: none; }
  a b { display: block; font-size: 26px; font-weight: normal; color: var(--yellow); }
  a span { color: var(--dim); font-size: 14px; }
</style>
</head>
<body>
  <h1>GRY</h1>
  <ul>
    <li><a href="liczozerca/"><b>LICZOŻERCA</b><span>ZJADAJ WYNIKI DZIAŁAŃ - DODAWANIE, ODEJMOWANIE, MNOŻENIE, DZIELENIE</span></a></li>
    <li><a href="laboratorium/"><b>TAJNE LABORATORIUM</b><span>ZBIERAJ KLUCZE, OTWIERAJ DRZWI I ROZWIĄZUJ ZADANIA NA KOMPUTERACH</span></a></li>
  </ul>
</body>
</html>
